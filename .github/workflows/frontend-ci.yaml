name: Frontend CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: weather-frontend
        run: npm install
      - name: Run lint
        working-directory: weather-frontend
        run: npm run lint
      - name: Run tests
        working-directory: weather-frontend
        run: npm test
