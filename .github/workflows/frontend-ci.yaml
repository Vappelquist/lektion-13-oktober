name: Frontend CI

on:
  push:
    branches:
      - main

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: 22
        - name: Install dependencies
          working-directory: weather-forecast
          run: npm install
        - name: Run lint
          working-directory: weather-forecast
          run: npm run lint
        - name: Run tests
          working-directory: weather-forecast
          run: npm test
